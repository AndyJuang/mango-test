<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>考古埕周遭</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Noto Serif TC", "Songti TC", serif;
            background-color: #000;
            color: #ddd;
        }

        /* --- 刮刮樂小遊戲 --- */
        #scratch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        #scratch-container {
            position: relative;
            width: 600px;
            height: 400px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            user-select: none;
        }

        #secret-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0505, #441111);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            text-align: center;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        #secret-text {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #e15f41;
            opacity: 0;
            transition: opacity 1s;
        }

        #enter-game-btn {
            padding: 10px 30px;
            font-size: 1.2rem;
            background: #e15f41;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            font-family: "Noto Serif TC", serif;
        }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
            /* 防止手機滑動頁面 */
        }

        .scratch-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 1rem;
            pointer-events: none;
        }

        /* --- 序章故事螢幕 (保留但隱藏) --- */
        #intro-screen {
            display: none;
        }

        /* --- 遊戲 UI --- */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 1.5s;
        }

        .header {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            padding: 30px;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            color: #e15f41;
            text-shadow: 0 0 10px rgba(225, 95, 65, 0.3);
            font-weight: 700;
        }

        .chapter-tag {
            display: inline-block;
            border: 1px solid #aaa;
            color: #aaa;
            padding: 2px 8px;
            font-size: 12px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .description {
            margin-top: 15px;
            font-size: 15px;
            color: #ccc;
            max-width: 600px;
            line-height: 1.8;
            text-shadow: 1px 1px 2px black;
            border-left: 2px solid #e15f41;
            padding-left: 15px;
        }

        .footer {
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            pointer-events: auto;
            display: flex;
            justify-content: center;
            /* 改為置中 */
            align-items: flex-end;
        }

        /* 轉場與通知 */
        .fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 100;
        }
    </style>
</head>

<body>

    <!-- Scratch Game Overlay -->
    <div id="scratch-overlay">
        <div id="scratch-container">
            <div id="secret-content">
                <div id="secret-text"></div>
                <button id="enter-game-btn">進入記憶</button>
            </div>
            <canvas id="scratch-canvas" width="600" height="400"></canvas>
            <div class="scratch-hint">請刮開上方銀漆以尋找線索...</div>
        </div>
    </div>

    <!-- Original UI (Hidden initially) -->
    <div id="ui-container">
        <div class="header">
            <div class="chapter-tag" id="location-chapter">序章</div>
            <h1 id="location-title">載入中...</h1>
            <div id="location-desc" class="description">...</div>
        </div>

        <div class="footer">
            <div style="font-size: 12px; color: #888; letter-spacing: 1px;">
                拖曳視角 • 點擊箭頭移動
            </div>
            <!-- Video Control Button (Hidden by default) -->
            <button id="video-btn"
                style="display:none; margin-left: 20px; padding: 8px 16px; background: rgba(225, 95, 65, 0.8); border: none; color: white; cursor: pointer;">
                播放影片
            </button>
        </div>
    </div>

    <div id="fade-overlay" class="fade-overlay"></div>

    <!-- Hidden Video Element -->
    <video id="video-player" loop crossOrigin="anonymous" playsinline style="display:none;">
        <source src="" type="video/mp4">
    </video>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="bgmusic.m4a" type="audio/mp4">
    </audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scratch Game Logic ---
        function initScratchGame() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            // Load and draw the cover image
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, width, height);
            };
            img.src = 'scratch_cover.png';

            let isDrawing = false;
            let lastPoint = null;

            function getBrushPos(xRef, yRef) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (xRef - rect.left) * (canvas.width / rect.width),
                    y: (yRef - rect.top) * (canvas.height / rect.height)
                };
            }

            function startDraw(e) {
                isDrawing = true;
                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                lastPoint = getBrushPos(clientX, clientY);
            }

            function moveDraw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // prevent scrolling on touch

                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                const currentPoint = getBrushPos(clientX, clientY);

                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 100; // 筆刷放大
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                if (lastPoint) {
                    ctx.moveTo(lastPoint.x, lastPoint.y);
                    ctx.lineTo(currentPoint.x, currentPoint.y);
                } else {
                    ctx.moveTo(currentPoint.x, currentPoint.y);
                    ctx.lineTo(currentPoint.x + 0.1, currentPoint.y + 0.1);
                }
                ctx.stroke();

                lastPoint = currentPoint;
                checkReveal();
            }

            function endDraw() {
                isDrawing = false;
                lastPoint = null;
            }

            // Events
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', moveDraw, { passive: false });
            canvas.addEventListener('touchend', endDraw);

            let revealed = false;
            function checkReveal() {
                if (revealed) return;
                // Simply check every 20th pixel to save perf
                const imageData = ctx.getImageData(0, 0, width, height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                const totalPixels = pixels.length / 4;

                for (let i = 0; i < pixels.length; i += 4 * 20) {
                    if (pixels[i + 3] < 128) {
                        transparentPixels++;
                    }
                }

                // 若刮開超過 25% 即可
                if (transparentPixels / (totalPixels / 20) > 0.25) {
                    revealed = true;
                    onRevealed();
                }
            }
        }

        function onRevealed() {
            document.getElementById('secret-text').style.opacity = 1;
            const btn = document.getElementById('enter-game-btn');
            btn.style.opacity = 1;
            btn.style.pointerEvents = 'auto';

            // Fade out canvas smoothly
            const canvas = document.getElementById('scratch-canvas');
            canvas.style.transition = 'opacity 1s';
            canvas.style.opacity = 0;

            setTimeout(() => {
                canvas.style.display = 'none';
            }, 1000);
        }

        document.getElementById('enter-game-btn').addEventListener('click', () => {
            const overlay = document.getElementById('scratch-overlay');
            overlay.style.transition = 'opacity 1s';
            overlay.style.opacity = 0;
            setTimeout(() => {
                overlay.style.display = 'none';
                enterMainGame();
            }, 1000);
        });

        // --- 故事化地點設定 (The Five Memories) ---
        const LOCATIONS = {
            treehouse: {
                id: 'treehouse',
                chapter: "記憶之三：秘密的住所",
                title: "考古埕周遭（富商唐人區）",
                desc: "你依照那個人留下的線索，來到延平老街上附近一棟不起眼的老宅。但透過羅盤，你看的出來這裡也透付出不少的時空能量。",
                themeColor: 0x2E8B57,
                bgType: 'grid',
                defaultImage: 'https://i.imgur.com/C4JHpXs.jpeg',
                video: '1.mp4',
                infos: [
                    {
                        title: "秘密基地",
                        content: "你看著牆上很多的資料還有文獻，從荷蘭時期一直到日治都有。「本機構負責監控並修正非正常時間接觸事件。」「代號：TAM1684，狀態：失聯／誤啟動」旁邊有一張當時的地圖。",
                        pos: { x: 0, y: -5, z: 45 }
                    },
                    {
                        title: "白哥",
                        content: "「我知道你現在一定一頭霧水。」「簡單說吧，我確實是漢人富商，但那只是我留在這個時代的身份。」「我們機構的工作就是穿越時空解決各個時代的問題。」「而你手上的羅盤，就是我們用來尋找有錯誤能量的設備，也不知道為什麼你碰巧獲得了。」白哥停頓了一下，指向牆上的圖「那個盒子不是什麼古物，它是時空錨點機。」這不就是剛剛何斌身上掉落的物品嗎。「原本的用途，是讓不同時間的人，能在『固定節點』短暫停留，簡單來說就是穿越時空。」他皺了皺眉。「但這個何斌在跑路的時候，意外地拿走了不屬於他的東西，才導致了這個情況，我篤定他會往人潮多的地方逃跑。」",
                        pos: { x: -45, y: -5, z: 0 },
                        width: 1800,
                        height: 1300
                    },
                    {
                        title: "延平老街",
                        content: "延平街，即今日所稱的安平老街，又稱為安平第一街，形成於 17 世紀荷蘭統治時期，原為連接熱蘭遮城與市鎮的重要通道。歷經不同政權更替，此地始終是安平商業與生活活動的核心。",
                        pos: { x: 0, y: -5, z: -45 }
                    },
                    {
                        title: "考古埕",
                        content: "這裡是考古埕，現在可以看到一個大的考古探坑位於這裡，裡面呈現了有各個不同時代的地層還有建築樣貌，是一個適合全家大小出遊的地方。",
                        pos: { x: 45, y: -5, z: 0 }
                    }
                ]
            }
        };

        // --- 全域變數 ---
        let scene, camera, renderer, controls;
        let raycaster, mouse;
        let currentSphere;
        let sprites = [];
        let currentId = 'treehouse';
        const textureLoader = new THREE.TextureLoader();
        let videoElement, videoTexture;

        // --- 序章動畫 / 初始化 ---
        window.onload = function () {
            // 初始化刮刮樂
            initScratchGame();

            // 預先載入 3D 但不顯示
            initThreeJS();

            // Setup video button
            const videoBtn = document.getElementById('video-btn');
            videoBtn.addEventListener('click', () => {
                if (videoElement.paused) {
                    videoElement.play();
                    videoBtn.innerText = "暫停影片";
                } else {
                    videoElement.pause();
                    videoBtn.innerText = "播放影片";
                }
            });
        };

        function enterMainGame() {
            const ui = document.getElementById('ui-container');
            ui.style.opacity = 1;

            // 開始渲染迴圈
            animate();

            // Play music
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.5;
            bgMusic.play().catch(error => {
                console.log("Autoplay prevented by browser policy. Music will start on interaction.");
            });
        }

        // --- Three.js 核心 ---
        function initThreeJS() {
            const container = document.body;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.rotateSpeed = -0.5;

            // 設定初始視角朝左 (90度)
            controls.target.set(-1, 0, 0);
            controls.update();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Init Video
            videoElement = document.getElementById('video-player');
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.SRGBColorSpace;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            loadLocation('treehouse');
        }

        function createGridTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 深色背景，營造神秘感
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 1024, 512);

            const color = new THREE.Color(colorHex);

            // 隨機雜訊 (模擬記憶模糊)
            for (let i = 0; i < 5000; i++) {
                ctx.fillStyle = `rgba(${color.r * 255}, ${color.g * 255}, ${color.b * 255}, ${Math.random() * 0.1})`;
                ctx.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2);
            }

            // 網格線
            ctx.strokeStyle = `rgba(${color.r * 255}, ${color.g * 255}, ${color.b * 255}, 0.3)`;
            ctx.lineWidth = 1;
            const gridSize = 64;
            for (let x = 0; x <= 1024; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
            }
            for (let y = 0; y <= 512; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function loadLocation(id) {
            currentId = id;
            const data = LOCATIONS[id];

            document.getElementById('location-chapter').innerText = data.chapter;
            document.getElementById('location-title').innerText = data.title;
            document.getElementById('location-desc').innerText = data.desc;

            // Reset video state
            videoElement.pause();
            videoElement.src = "";
            document.getElementById('video-btn').style.display = 'none';

            if (currentSphere) scene.remove(currentSphere);
            sprites.forEach(s => scene.remove(s));
            sprites = [];

            let material;

            // 優先檢查是否有影片
            if (data.video && data.video !== '') {
                videoElement.src = data.video;
                videoElement.play().then(() => {
                    document.getElementById('video-btn').innerText = "暫停影片";
                }).catch(e => {
                    console.log("Autoplay blocked, waiting for user interaction", e);
                    document.getElementById('video-btn').innerText = "播放影片";
                });
                document.getElementById('video-btn').style.display = 'block';

                material = new THREE.MeshBasicMaterial({ map: videoTexture });
                // 影片通常需要水平翻轉
                // geometry scale -1, 1, 1 已經做了翻轉，這裡不需要額外處理，除非影片本身是反的
            }
            // 其次檢查預設圖片
            else if (data.defaultImage && data.defaultImage !== '') {
                const texture = textureLoader.load(data.defaultImage);
                texture.colorSpace = THREE.SRGBColorSpace;
                material = new THREE.MeshBasicMaterial({ map: texture });
            }
            // 最後使用網格
            else {
                const texture = createGridTexture(data.themeColor);
                material = new THREE.MeshBasicMaterial({ map: texture });
            }

            const geometry = new THREE.SphereGeometry(60, 60, 40);
            geometry.scale(-1, 1, 1);
            currentSphere = new THREE.Mesh(geometry, material);
            scene.add(currentSphere);

            if (data.infos) {
                data.infos.forEach(info => {
                    createSprite(info, data.themeColor);
                });
            }
        }

        function createIconTexture(themeColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const color = new THREE.Color(themeColorHex);
            const colorStr = `rgb(${color.r * 255},${color.g * 255},${color.b * 255})`;

            // 圓形背景
            ctx.beginPath();
            ctx.arc(64, 64, 50, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = colorStr;
            ctx.stroke();

            // 驚嘆號 !
            ctx.fillStyle = "#FFFF00";
            ctx.font = "bold 80px 'Noto Serif TC', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("!", 64, 68);

            return new THREE.CanvasTexture(canvas);
        }

        function createContentTexture(infoData, themeColorHex) {
            // 大幅放大 Canvas 解析度以容納長文字
            const width = 1600;
            const height = 1200;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const color = new THREE.Color(themeColorHex);
            const colorStr = `rgb(${color.r * 255},${color.g * 255},${color.b * 255})`;

            // Background
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(0, 0, width, height - 50, 40);
            } else {
                ctx.fillRect(0, 0, width, height - 50);
            }
            ctx.fill();

            // Border
            ctx.strokeStyle = colorStr;
            ctx.lineWidth = 15;
            ctx.stroke();

            // Title
            ctx.font = "bold 90px 'Noto Serif TC'";
            ctx.fillStyle = colorStr;
            ctx.textAlign = "left";
            ctx.fillText(infoData.title, 80, 130);

            // Separator Line
            ctx.beginPath();
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 4;
            ctx.moveTo(80, 160);
            ctx.lineTo(width - 80, 160);
            ctx.stroke();

            // Content - Multi-line Text Wrapping
            ctx.font = "55px 'Noto Serif TC'";
            ctx.fillStyle = "#eee";
            ctx.textAlign = "left";

            // Draw content text with wrapping
            const textX = 80;
            let textY = 240;
            const lineHeight = 80;
            let maxWidth = width - 160;

            const texture = new THREE.CanvasTexture(canvas);

            // 如果有圖片，進行排版調整 (side-by-side)
            if (infoData.overlayImg) {
                // 文字寬度減半 (留給圖片)
                maxWidth = (width - 160) * 0.55;

                // 載入並繪製圖片
                const img = new Image();
                img.onload = () => {
                    // 計算圖片位置 (右側)
                    const imgX = width * 0.6;
                    const imgY = 240;
                    const imgW = width * 0.35;
                    const imgH = height * 0.6; // Allow taller image

                    // 保持比例繪製 (contain)
                    const aspect = img.width / img.height;
                    let drawW = imgW;
                    let drawH = drawW / aspect;
                    if (drawH > imgH) {
                        drawH = imgH;
                        drawW = drawH * aspect;
                    }

                    // Center image horizontally in its area
                    const areaCenterX = imgX + imgW / 2;
                    const drawX = areaCenterX - drawW / 2;

                    ctx.drawImage(img, drawX, imgY, drawW, drawH);

                    // 畫個邊框給圖片
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 5;
                    ctx.strokeRect(drawX, imgY, drawW, drawH);

                    texture.needsUpdate = true; // 通知 Three.js 更新貼圖
                };
                img.src = infoData.overlayImg;
            }

            // 如果有背景圖 (bgImg) 的邏輯 (從 index1 移植過來以防萬一用到)
            // 但 index2 沒用這段，所以這裡先保持 index2 的邏輯 (只處理 overlayImg)
            // 若需要支援 bgImg (信紙背景)，需要額外加入。 
            // 這裡先完全複製 index2 的邏輯。

            wrapText(ctx, infoData.content, textX, textY, maxWidth, lineHeight);

            // Pointer (Triangle at bottom)
            ctx.beginPath();
            ctx.fillStyle = colorStr;
            ctx.moveTo(width / 2 - 40, height - 50);
            ctx.lineTo(width / 2 + 40, height - 50);
            ctx.lineTo(width / 2, height);
            ctx.fill();

            return texture;
        }

        function createSprite(infoData, themeColorHex) {
            // 1. 建立內容貼圖 (Content Texture)
            const contentTexture = createContentTexture(infoData, themeColorHex);

            // 2. 建立圖示貼圖 (Icon Texture)
            const iconTexture = createIconTexture(themeColorHex);

            // 3. 初始狀態：使用圖示
            const material = new THREE.SpriteMaterial({ map: iconTexture, depthTest: false });
            const sprite = new THREE.Sprite(material);

            sprite.position.set(infoData.pos.x, infoData.pos.y, infoData.pos.z);

            // 初始大小：小圖示
            const smallScale = new THREE.Vector3(5, 5, 1);
            const largeScale = new THREE.Vector3(40, 30, 1);
            sprite.scale.copy(smallScale);

            sprite.userData = {
                isExpanded: false,
                iconTexture: iconTexture,
                contentTexture: contentTexture,
                smallScale: smallScale,
                largeScale: largeScale
            };

            scene.add(sprite);
            sprites.push(sprite);
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(''); // Splitting by character for Chinese text
            let line = '';

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                }
                else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(sprites);

            if (intersects.length > 0) {
                const sprite = intersects[0].object;

                if (!sprite.userData.isExpanded) {
                    // 展開
                    sprite.material.map = sprite.userData.contentTexture;
                    sprite.scale.copy(sprite.userData.largeScale);
                    sprite.userData.isExpanded = true;
                } else {
                    // 收起
                    sprite.material.map = sprite.userData.iconTexture;
                    sprite.scale.copy(sprite.userData.smallScale);
                    sprite.userData.isExpanded = false;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
