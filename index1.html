<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>何斌的住家</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Noto Serif TC", "Songti TC", serif;
            background-color: #000;
            color: #ddd;
        }

        /* --- 刮刮樂小遊戲 --- */
        #scratch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        #scratch-container {
            position: relative;
            width: 600px;
            height: 400px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            user-select: none;
        }

        #secret-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0505, #441111);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            text-align: center;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        #secret-text {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #e15f41;
            opacity: 0;
            transition: opacity 1s;
        }

        #enter-game-btn {
            padding: 10px 30px;
            font-size: 1.2rem;
            background: #e15f41;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            font-family: "Noto Serif TC", serif;
        }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
            /* 防止手機滑動頁面 */
        }

        .scratch-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 1rem;
            pointer-events: none;
        }

        /* --- 序章故事螢幕 (保留但隱藏) --- */
        #intro-screen {
            display: none;
        }

        /* --- 遊戲 UI --- */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 1.5s;
        }

        .header {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            padding: 30px;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            color: #e15f41;
            text-shadow: 0 0 10px rgba(225, 95, 65, 0.3);
            font-weight: 700;
        }

        .chapter-tag {
            display: inline-block;
            border: 1px solid #aaa;
            color: #aaa;
            padding: 2px 8px;
            font-size: 12px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .description {
            margin-top: 15px;
            font-size: 15px;
            color: #ccc;
            max-width: 600px;
            line-height: 1.8;
            text-shadow: 1px 1px 2px black;
            border-left: 2px solid #e15f41;
            padding-left: 15px;
        }

        .footer {
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            pointer-events: auto;
            display: flex;
            justify-content: center;
            /* 改為置中 */
            align-items: flex-end;
        }

        /* 轉場與通知 */
        .fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 100;
        }
    </style>
</head>

        // --- Scratch Game Logic ---
        function initScratchGame() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            // Load and draw the cover image
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, width, height);
            };
            img.src = 'scratch_cover.png';

            let isDrawing = false;
            let lastPoint = null;

            function getBrushPos(xRef, yRef) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (xRef - rect.left) * (canvas.width / rect.width),
                    y: (yRef - rect.top) * (canvas.height / rect.height)
                };
            }

            function startDraw(e) {
                isDrawing = true;
                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                lastPoint = getBrushPos(clientX, clientY);
            }

            function moveDraw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // prevent scrolling on touch

                const { clientX, clientY } = e.touches ? e.touches[0] : e;
                const currentPoint = getBrushPos(clientX, clientY);

                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 100; // 筆刷放大
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                if (lastPoint) {
                    ctx.moveTo(lastPoint.x, lastPoint.y);
                    ctx.lineTo(currentPoint.x, currentPoint.y);
                } else {
                    ctx.moveTo(currentPoint.x, currentPoint.y);
                    ctx.lineTo(currentPoint.x + 0.1, currentPoint.y + 0.1);
                }
                ctx.stroke();

                lastPoint = currentPoint;
                checkReveal();
            }

            function endDraw() {
                isDrawing = false;
                lastPoint = null;
            }

            // Events
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', moveDraw, { passive: false });
            canvas.addEventListener('touchend', endDraw);

            let revealed = false;
            function checkReveal() {
                if (revealed) return;
                // Simply check every 20th pixel to save perf
                const imageData = ctx.getImageData(0, 0, width, height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                const totalPixels = pixels.length / 4;

                for (let i = 0; i < pixels.length; i += 4 * 20) {
                    if (pixels[i + 3] < 128) {
                        transparentPixels++;
                    }
                }

                // 若刮開超過 25% 即可 (降低門檻讓遊戲更容易)
                if (transparentPixels / (totalPixels / 20) > 0.25) {
                    revealed = true;
                    onRevealed();
                }
            }
        }

            document.getElementById('secret-text').style.opacity = 1;

            btn.style.pointerEvents = 'auto';

            // Fade out canvas smoothly
            const canvas = document.getElementById('scratch-canvas');
            canvas.style.transition = 'opacity 1s';
            canvas.style.opacity = 0;

            setTimeout(() => {
                canvas.style.display = 'none';
            }, 1000);
        }

        // --- 全域變數 ---
        let scene, camera, renderer, controls;

        // --- 序章動畫 / 初始化 ---

        // --- OLD enterGame removed ---

        // --- Three.js 核心 ---
        function initThreeJS() {
            const container = document.body;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.rotateSpeed = -0.5;

            // 設定初始視角朝左 (90度)
            // 原本是看 (0,0,0)，相機在 (0,0,0.1)
            // 透過設定 controls.target 來改變視角中心
            // 往左看意味著 target 應該在 x 負軸方向
            controls.target.set(-1, 0, 0);
            controls.update();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Init Video
            videoElement = document.getElementById('video-player');
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.SRGBColorSpace;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            loadLocation('fort');

            // addDebugHelpers(); // 加入輔助線與原點標示
        }

        function addDebugHelpers() {
            // 1. 自製粗壯的座標軸 (0,0,0)
            // X軸 (紅)
            const xGeo = new THREE.CylinderGeometry(0.5, 0.5, 60, 16);
            xGeo.translate(0, 30, 0); // 讓圓柱起點在原點，向正方向延伸
            xGeo.rotateZ(-Math.PI / 2); // 轉向 X 軸
            const xMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            scene.add(new THREE.Mesh(xGeo, xMat));

            // Y軸 (綠)
            const yGeo = new THREE.CylinderGeometry(0.5, 0.5, 60, 16);
            yGeo.translate(0, 30, 0); // 向正 Y 延伸
            const yMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            scene.add(new THREE.Mesh(yGeo, yMat));

            // Z軸 (藍)
            const zGeo = new THREE.CylinderGeometry(0.5, 0.5, 60, 16);
            zGeo.translate(0, 30, 0);
            zGeo.rotateX(Math.PI / 2); // 轉向 Z 軸
            const zMat = new THREE.MeshBasicMaterial({ color: 0x0000ff });
            scene.add(new THREE.Mesh(zGeo, zMat));

            // 2. 加粗的黃色圓圈輔助線 (TorusGeometry 甜甜圈形狀)
            // 參數: 半徑 40, 管徑 0.5, 圓管切分 8, 圓環切分 100
            const torusGeo = new THREE.TorusGeometry(40, 0.5, 8, 100);
            const torusMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const circle = new THREE.Mesh(torusGeo, torusMat);

            circle.rotation.x = Math.PI / 2; // 躺平
            circle.position.y = -5;          // 高度
            scene.add(circle);
        }

        function createGridTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 深色背景，營造神秘感
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 1024, 512);

            const color = new THREE.Color(colorHex);

            // 隨機雜訊 (模擬記憶模糊)
            for (let i = 0; i < 5000; i++) {
                ctx.fillStyle = `rgba(${color.r * 255}, ${color.g * 255}, ${color.b * 255}, ${Math.random() * 0.1})`;
                ctx.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2);
            }

            // 網格線
            ctx.strokeStyle = `rgba(${color.r * 255}, ${color.g * 255}, ${color.b * 255}, 0.3)`;
            ctx.lineWidth = 1;
            const gridSize = 64;
            for (let x = 0; x <= 1024; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
            }
            for (let y = 0; y <= 512; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function loadLocation(id) {
            currentId = id;
            const data = LOCATIONS[id];

            document.getElementById('location-chapter').innerText = data.chapter;
            document.getElementById('location-title').innerText = data.title;
            document.getElementById('location-desc').innerText = data.desc;

            // Reset video state
            videoElement.pause();
            videoElement.src = "";
            document.getElementById('video-btn').style.display = 'none';

            if (currentSphere) scene.remove(currentSphere);
            sprites.forEach(s => scene.remove(s));
            sprites = [];

            let material;

            // 優先檢查是否有影片
            if (data.video && data.video !== '') {
                videoElement.src = data.video;
                videoElement.play().then(() => {
                    document.getElementById('video-btn').innerText = "暫停影片";
                }).catch(e => {
                    console.log("Autoplay blocked, waiting for user interaction", e);
                    document.getElementById('video-btn').innerText = "播放影片";
                });
                document.getElementById('video-btn').style.display = 'block';

                material = new THREE.MeshBasicMaterial({ map: videoTexture });
                // 影片通常需要水平翻轉
                // geometry scale -1, 1, 1 已經做了翻轉，這裡不需要額外處理，除非影片本身是反的
            }
            // 其次檢查預設圖片
            else if (data.defaultImage && data.defaultImage !== '') {
                const texture = textureLoader.load(data.defaultImage);
                texture.colorSpace = THREE.SRGBColorSpace;
                material = new THREE.MeshBasicMaterial({ map: texture });
            }
            // 最後使用網格
            else {
                const texture = createGridTexture(data.themeColor);
                material = new THREE.MeshBasicMaterial({ map: texture });
            }

            const geometry = new THREE.SphereGeometry(60, 60, 40);
            geometry.scale(-1, 1, 1);
            currentSphere = new THREE.Mesh(geometry, material);
            scene.add(currentSphere);

            if (data.infos) {
                data.infos.forEach(info => {
                    createSprite(info, data.themeColor);
                });
            }
        }

        function createContentTexture(infoData, themeColorHex) {
            // 大幅放大 Canvas 解析度以容納長文字
            const width = 1600;
            const height = 1200;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const color = new THREE.Color(themeColorHex);
            const colorStr = `rgb(${color.r * 255},${color.g * 255},${color.b * 255})`;

            const texture = new THREE.CanvasTexture(canvas);

            // 繪製內容的函式 (封裝以便異步呼叫)
            const drawContent = () => {
                // 如果沒有背景圖，就畫預設背景
                if (!infoData.bgImg) {
                    ctx.fillStyle = "rgba(0,0,0,0.85)";
                    ctx.fillRect(0, 0, width, height - 50);
                }

                // 邊框
                ctx.strokeStyle = colorStr;
                ctx.lineWidth = 15;
                ctx.strokeRect(10, 10, width - 20, height - 70);

                // 標題 (Title)
                ctx.font = "bold 90px 'Noto Serif TC'";
                // 如果有背景圖，標題顏色可能要調整，這裡暫時維持主題色或深色
                ctx.fillStyle = infoData.bgImg ? "#3e2723" : colorStr;
                ctx.textAlign = "center";
                ctx.fillText(infoData.title, width / 2, 130);

                // 分隔線
                ctx.beginPath();
                ctx.moveTo(100, 160);
                ctx.lineTo(width - 100, 160);
                ctx.strokeStyle = infoData.bgImg ? "#5d4037" : "#888";
                ctx.lineWidth = 2;
                ctx.stroke();

                // 若有背景圖，加一層半透明黑色底以提升可讀性
                if (infoData.bgImg) {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                    // 優化：使用圓角矩形並調整位置，讓版面更舒適
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(50, 220, width - 100, height - 350, 40);
                    } else {
                        ctx.fillRect(50, 220, width - 100, height - 350);
                    }
                    ctx.fill();
                }

                // 內文與圖片配置
                ctx.font = "55px 'Noto Serif TC'";
                // 因為加了黑底，文字主要改為淺灰
                ctx.fillStyle = "#eee";
                ctx.textAlign = "left";

                const textX = 90;   // 增加些許水平內距
                let textY = 310;    // 文字向下移動，避開上方分隔線
                const lineHeight = 80;
                let maxWidth = width - 180; // 對應新的內距調整文字寬度

                // 如果有側邊圖片 (overlayImg)，進行排版調整 (side-by-side)
                if (infoData.overlayImg) {
                    maxWidth = (width - 160) * 0.55;

                    const img = new Image();
                    img.onload = () => {
                        const imgX = width * 0.6;
                        const imgY = 240;
                        const imgW = width * 0.35;
                        const imgH = height * 0.6;

                        const aspect = img.width / img.height;
                        let drawW = imgW;
                        let drawH = drawW / aspect;
                        if (drawH > imgH) { drawH = imgH; drawW = drawH * aspect; }

                        const areaCenterX = imgX + imgW / 2;
                        const drawX = areaCenterX - drawW / 2;

                        ctx.drawImage(img, drawX, imgY, drawW, drawH);
                        ctx.strokeStyle = "#fff";
                        ctx.lineWidth = 5;
                        ctx.strokeRect(drawX, imgY, drawW, drawH);
                        texture.needsUpdate = true;
                    };
                    img.src = infoData.overlayImg;
                }

                wrapText(ctx, infoData.content, textX, textY, maxWidth, lineHeight);

                // 下方指標
                ctx.beginPath();
                ctx.fillStyle = colorStr;
                const centerX = width / 2;
                const bottomY = height - 50;
                ctx.moveTo(centerX - 30, bottomY);
                ctx.lineTo(centerX + 30, bottomY);
                ctx.lineTo(centerX, height);
                ctx.fill();

                texture.needsUpdate = true;
            };

            // 處理背景圖片載入
            if (infoData.bgImg) {
                const bg = new Image();
                bg.onload = () => {
                    // 繪製背景圖填滿整個內容區 (扣掉指標區)
                    ctx.drawImage(bg, 0, 0, width, height - 50);
                    // 畫個半透明遮罩確保文字可讀 (可選，視圖片深淺而定，這裡信紙圖案清晰所以主要靠文字變色)
                    // ctx.fillStyle = "rgba(255,255,255,0.3)";
                    // ctx.fillRect(0, 0, width, height - 50);

                    drawContent(); // 背景載入後再畫文字
                };
                bg.src = infoData.bgImg;
            } else {
                drawContent(); // 直接畫
            }

            return texture;
        }

        function createIconTexture(themeColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const color = new THREE.Color(themeColorHex);
            const colorStr = `rgb(${color.r * 255},${color.g * 255},${color.b * 255})`;

            // 圓形背景
            ctx.beginPath();
            ctx.arc(64, 64, 50, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = colorStr;
            ctx.stroke();

            // 驚嘆號 !
            ctx.fillStyle = "#FFFF00";
            ctx.font = "bold 80px 'Noto Serif TC', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("!", 64, 68);

            return new THREE.CanvasTexture(canvas);
        }

        function createSprite(infoData, themeColorHex) {
            const contentTexture = createContentTexture(infoData, themeColorHex);
            const iconTexture = createIconTexture(themeColorHex);

            // 初始狀態：使用圖示
            const material = new THREE.SpriteMaterial({ map: iconTexture, depthTest: false });
            const sprite = new THREE.Sprite(material);

            sprite.position.set(infoData.pos.x, infoData.pos.y, infoData.pos.z);

            // 初始大小：小圖示
            const smallScale = new THREE.Vector3(5, 5, 1);
            const largeScale = new THREE.Vector3(40, 30, 1); // Increased scale to match new resolution

            sprite.scale.copy(smallScale);

            sprite.userData = {
                isExpanded: false,
                iconTexture: iconTexture,
                contentTexture: contentTexture,
                smallScale: smallScale,
                largeScale: largeScale,
                overlayImg: infoData.overlayImg // Store overlay image path
            };

            scene.add(sprite);
            sprites.push(sprite);
        }

        // Helper function for wrapping text
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(''); // Splitting by character for Chinese text
            let line = '';

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                }
                else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(sprites);

            if (intersects.length > 0) {
                const sprite = intersects[0].object;

                if (!sprite.userData.isExpanded) {
                    // 展開
                    sprite.material.map = sprite.userData.contentTexture;
                    sprite.scale.copy(sprite.userData.largeScale);
                    sprite.userData.isExpanded = true;
                } else {
                    // 收起
                    sprite.material.map = sprite.userData.iconTexture;
                    sprite.scale.copy(sprite.userData.smallScale);
                    sprite.userData.isExpanded = false;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
